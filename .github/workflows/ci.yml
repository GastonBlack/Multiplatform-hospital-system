name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: hospital_test
          POSTGRES_PASSWORD: integration_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HOSPITAL_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=hospital_test;Password=integration_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HospitalPlatform.sln

      - name: Build solution
        run: dotnet build HospitalPlatform.sln --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test --solution HospitalPlatform.sln --configuration Release --no-build --no-restore
